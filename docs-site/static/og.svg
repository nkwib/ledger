    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1817" />
      <stop offset="1" stop-color="#07100f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="none" stroke="#1e2c2a" stroke-width="2" />

  <g transform="translate(112,120)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="#0d7d72" />
    <path d="M32 14l14 5.2v10.2C46 39.6 39.8 46.2 32 49.2 24.2 46.2 18 39.6 18 29.4V19.2L32 14z"
