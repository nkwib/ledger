  <text x="112" y="330" font-family="Inter, system-ui, sans-serif" font-size="66" fill="#eef4f3" font-weight="700" letter-spacing="-2">Verifiable offline ledger.</text>
  <text x="112" y="410" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#9db1ae" font-weight="400">Per-device signed hash chains that merge deterministically,</text>
  <text x="112" y="454" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#9db1ae" font-weight="400">with typed conflict flags. Zero deps. WebCrypto. Browser + Node.</text>

